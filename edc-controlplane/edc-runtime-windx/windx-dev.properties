# Minimal-Config zum lokalen Boot-Test der edc-runtime-windx (Phase 0).
# Dummy-Werte: erfuellen die Presence-Checks der Dependency-Injection des fest
# verdrahteten DCP-Stacks. Es findet KEIN echter Transfer / keine echte Identitaet
# statt -- das ist erst Thema von Phase 1/2 (Weg A/B/C im Integrationsplan).

edc.participant.id=WINDX_TEST
tractusx.edc.participant.bpn=BPNL000000000WINDX

# Web-Kontexte auf getrennte Ports (kombinierte CP+DP-Runtime -> sonst Kollision auf 8181)
web.http.port=8080
web.http.path=/api
web.http.management.port=8081
web.http.management.path=/management
web.http.control.port=8083
web.http.control.path=/control
web.http.protocol.port=8084
web.http.protocol.path=/api/v1/dsp
web.http.public.port=8085
web.http.public.path=/api/public
web.http.version.port=8086
web.http.version.path=/version

# Wind-X Mediator (med-Kontext, eigener Port -> keine Kollision mit 8080-8086)
web.http.med.port=8087
web.http.med.path=/api/med
# Semantic-Mediator-Basis-URL (Pflicht). Dummy reicht fuer Boot-/401-Smoke-Test (wird ohne echten Transfer nicht aufgerufen).
tx.edc.windx.mediator.base.url=http://localhost:3051

# BDRS (BPN/DID Resolution) -- Dummy-URL, wird beim Boot nicht aufgerufen
tx.edc.iam.dcp.bdrs.server.url=http://localhost:18081/api/bdrs

# DataPlane Token Refresh / IAM -- Vault-Key-Aliase (nur Presence noetig)
edc.transfer.proxy.token.signer.privatekey.alias=signer-private
edc.transfer.proxy.token.verifier.publickey.alias=verifier-public

# Secure Token Service (STS) Client -- Dummy-Werte
edc.iam.sts.oauth.token.url=http://localhost:18082/sts/token
edc.iam.sts.oauth.client.id=windx-client
edc.iam.sts.oauth.client.secret.alias=client-secret
