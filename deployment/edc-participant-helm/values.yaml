namespace: edc-participant
fullnameOverride: ""
# Applied to every Pod, including bootstrap/provisioning Jobs.
imagePullSecrets: []

participant:
  # This hostname becomes did:web:<publicHost>. Keep it stable for the life of the participant.
  publicHost: edc.partner.example
  bpn: BPNLCHANGEME
  operatorDid: did:web:auth-windx.cluster.swms-cloud.com
  bdrsUrl: https://auth-windx.cluster.swms-cloud.com/api/directory
  mediatorBaseUrl: http://semanticmediator:3051

secrets:
  # Generate once and reuse on upgrades. Set false for an externally managed Secret.
  create: true
  name: ""
  keys:
    postgresPassword: postgres-password
    vaultToken: vault-token
    superuserKey: superuser-key
    managementKey: management-key

postgresql:
  # When enabled, this single-replica PostgreSQL instance creates `edc` and `ih`.
  # For production HA, set enabled=false and use a managed/operator PostgreSQL service;
  # create both databases and grant the configured user access before installation.
  enabled: true
  image: postgres:16.4-alpine
  # Empty names derive from the Helm release, allowing multiple participants per namespace.
  serviceName: ""
  # Used only when enabled=false.
  host: ""
  port: 5432
  username: edc
  defaultDatabase: edc
  identityHubDatabase: ih
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

vault:
  # Compose-compatible dev Vault + persistent backup keeper. For an existing,
  # initialized KV v2 Vault, disable this and set url and secrets.create=false.
  enabled: true
  image: hashicorp/vault:1.17
  url: ""
  serviceName: ""
  keeperImage: curlimages/curl:8.10.1
  backupIntervalSeconds: 30
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  kvV2DataPath: secret/data
  secretApiPath: /v1/secret
  healthApiPath: /v1/sys/health
  bootstrap:
    enabled: true
    image: curlimages/curl:8.10.1

identityhub:
  image:
    repository: tractusx/identityhub
    tag: 0.3.2
    pullPolicy: IfNotPresent
  replicaCount: 1
  serviceName: ""
  logInitImage: busybox:1.36.1
  provision:
    enabled: true
    image: curlimages/curl:8.10.1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

connector:
  fullnameOverride: ""
  # Optional existing registry Secret; alternatively use imagePullSecrets above.
  imagePullSecret: ""
  logLevel: INFO

controlplane:
  image:
    repository: ghcr.io/wind-x-eu/edc-controlplane-postgresql-hashicorp-vault
    tag: sha-9f724fe
    pullPolicy: IfNotPresent
  replicaCount: 1
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

dataplane:
  image:
    repository: ghcr.io/wind-x-eu/edc-dataplane-windx
    tag: sha-9f724fe
    pullPolicy: IfNotPresent
  replicaCount: 1
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

ingress:
  enabled: false
  className: nginx
  tls:
    enabled: true
    secretName: edc-participant-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
