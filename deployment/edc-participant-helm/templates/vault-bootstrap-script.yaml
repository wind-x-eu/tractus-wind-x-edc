{{- if .Values.vault.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "windx.fullname" . }}-vault-bootstrap-script
  labels:
    {{- include "windx.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  vault-bootstrap.sh: |
{{ .Files.Get "files/vault-bootstrap.sh" | indent 4 }}
{{- end }}
