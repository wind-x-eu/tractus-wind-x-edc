{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "windx.fullname" . }}
  labels:
    {{- include "windx.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.participant.publicHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.participant.publicHost | quote }}
      http:
        paths:
          - path: /.well-known/did.json
            pathType: Exact
            backend:
              service:
                name: {{ .Values.identityhub.serviceName }}
                port:
                  number: 8084
          - path: /api/credentials
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.identityhub.serviceName }}
                port:
                  number: 8083
          - path: /api/v1/dsp
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-controlplane" .Values.connector.fullnameOverride }}
                port:
                  number: 8084
          - path: /api/public
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-dataplane" .Values.connector.fullnameOverride }}
                port:
                  number: 8081
{{- end }}
