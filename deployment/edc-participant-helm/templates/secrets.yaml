{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "windx.secretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "windx.secretName" . }}
  labels:
    {{- include "windx.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $kind, $key := .Values.secrets.keys }}
  {{- if $existing }}
  {{ $key }}: {{ required (printf "Existing Secret is missing key %s; restore the original credentials" $key) (index $existing.data $key) | quote }}
  {{- else if eq $kind "superuserKey" }}
  {{ $key }}: {{ printf "c3VwZXItdXNlcg==.%s" (randAlphaNum 48) | b64enc | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
