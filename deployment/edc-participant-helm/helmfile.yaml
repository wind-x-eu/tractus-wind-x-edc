environments:
  default:
    values:
      - values.yaml
      - values-windx.yaml

helmDefaults:
  wait: true
  timeout: 900
  createNamespace: true

releases:
  - name: windx-participant
    namespace: {{ .Values.namespace | quote }}
    chart: .
    values:
      - values.yaml
      - values-windx.yaml

  - name: {{ .Values.connector.releaseName | quote }}
    namespace: {{ .Values.namespace | quote }}
    chart: ../../charts/tractusx-connector
    needs:
      - {{ printf "%s/windx-participant" .Values.namespace | quote }}
    values:
      - values-connector.yaml.gotmpl
