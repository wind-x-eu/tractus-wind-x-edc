Appenders:
  Console:
    name: CONSOLE
    JsonTemplateLayout:
      eventTemplate: |-
        {
          "timestamp": {
            "$resolver": "timestamp",
            "pattern": {
              "format": "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS",
              "timeZone": "UTC"
            }
          },
          "level": {
            "$resolver": "level",
            "field": "severity",
            "severity": {
              "field": "keyword"
            }
          },
          "message": {
            "$resolver": "message"
          }
        }
Loggers:
  Root:
    level: "OFF"
  Logger:
    name: org.eclipse.edc.monitor.logger
    level: DEBUG
    AppenderRef:
      ref: CONSOLE