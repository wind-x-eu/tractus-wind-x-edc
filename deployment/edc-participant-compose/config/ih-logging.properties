handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler
# Console Handler Config
java.util.logging.ConsoleHandler.formatter = org.eclipse.tractusx.identityhub.monitor.ColorfulFormatter
java.util.logging.ConsoleHandler.level = FINE
# File Handler Config
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.count = 1
java.util.logging.FileHandler.formatter = org.eclipse.tractusx.identityhub.monitor.ColorfulFormatter
java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.limit = 0
java.util.logging.FileHandler.pattern = /app/logs/identityhub.log
# Formatter Configs
org.eclipse.tractusx.identityhub.monitor.ColorfulFormatter.format = %7$s[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS] [%4$s] %5$s%6$s%n%8$s
# Root level and Package level control
.level=INFO
jakarta.json.level = OFF
jdk.event.level = OFF
okhttp3.internal.level = OFF
org.eclipse.edc.level = FINE
org.eclipse.tractusx.level = FINE
org.flywaydb.level = OFF
org.glassfish.level = OFF
org.jvnet.level = OFF
org.postgresql.level = OFF