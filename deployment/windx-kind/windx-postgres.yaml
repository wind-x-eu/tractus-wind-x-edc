# PostgreSQL fuer den windx-Stack (WP0 der Persistenz-Umstellung).
#
# Ein Postgres-Instance im Namespace `windx` mit drei Datenbanken:
#   - provider : Stores des windx-provider  (Assets, Policies, ContractDefs, Negotiations, Agreements, EDR, DataPlane)
#   - consumer : Stores des windx-consumer
#   - ihub     : Stores des IdentityHub (erst ab WP3 genutzt -- hier schon angelegt)
#
# Anders als das MVD-Postgres (ephemer) haengt hier eine PVC dran -> Daten ueberleben den Pod-Neustart.
# Passwort liegt im Secret `windx-db` (nicht im Klartext-YAML der Connectoren).
#
# Deploy:  kubectl --context kind-mvd apply -f windx-postgres.yaml
#          kubectl --context kind-mvd -n windx rollout status deploy/windx-postgres --timeout=120s
---
# Das Secret `windx-db` (key: password) steht bewusst nicht hier, sondern wird von
# `./windx-secrets.sh` erzeugt (WP4) -- ein Wert im committeten YAML waere Klartext in Git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: windx-postgres-init
  namespace: windx
data:
  # Laeuft einmalig bei erster Initialisierung des Datenverzeichnisses (leere PVC).
  init.sql: |
    CREATE DATABASE provider;
    CREATE DATABASE consumer;
    CREATE DATABASE ihub;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windx-postgres-data
  namespace: windx
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName weggelassen -> KinD-Default `standard` (rancher.io/local-path)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windx-postgres
  namespace: windx
  labels:
    app: windx-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # ReadWriteOnce-PVC -> kein paralleles Mounten beim Rollout
  selector:
    matchLabels:
      app: windx-postgres
  template:
    metadata:
      labels:
        app: windx-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.7-alpine   # gleiche Version wie das MVD-Postgres (Node-Cache nutzen)
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: edc }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-db
                  key: password
            - { name: POSTGRES_DB, value: edc }   # Default-DB; provider/consumer/ihub kommen aus init.sql
            # Datenverzeichnis in ein Unterverzeichnis der PVC (lost+found bei manchen Volumes stoert sonst initdb).
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data,        mountPath: /var/lib/postgresql/data }
            - { name: init-script, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U edc -d edc"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U edc -d edc"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: windx-postgres-data
        - name: init-script
          configMap:
            name: windx-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: windx-postgres
  namespace: windx
spec:
  selector:
    app: windx-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
