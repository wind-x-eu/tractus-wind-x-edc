# Wind-X-Connector-Stack im lokalen KinD-Cluster (`kind-mvd`), Namespace `windx`.
#
# Portierung von `kubernetes/bibas/bibas-stack.yaml` (K3s) auf KinD, mit getauschtem
# Connector-Image: statt des BIBA-Connectors (Vanilla-EDC 0.14/0.17) laeuft hier unsere
# `edc-runtime-windx` (Tractus-X-Flavor, kombinierte CP+DP, inkl. windx-Extensions).
# Der MVD in den Namespaces provider/consumer/issuer bleibt unangetastet.
#
# Drei bewusste Abweichungen von der K3s-Vorlage:
#
#   1. KEINE Registry, KEINE imagePullSecrets. Alle drei Images liegen lokal und werden
#      per `kind load docker-image ... --name mvd` in den Cluster geschoben:
#        - edc-runtime-windx:0.13.0-SNAPSHOT              (unser Connector, NEU)
#        - lufbiba/fma-identityhub:0.17                   (IdentityHub, unveraendert)
#        - reg.biba.uni-bremen.de/wind-x/luf-bibas-connector:jira132-es256k
#          (NUR fuer den Setup-Job: die Klasse IdentityHubSetup spricht ausschliesslich
#           die IdentityHub-HTTP-API und ist vom Connector-Runtime unabhaengig)
#
#   2. KEIN Ingress, KEIN coredns-custom, KEINE *.tx.test-Hostnamen. Die DIDs zeigen
#      direkt auf den K8s-Service:  did:web:windx-identityhub:provider
#      Damit das ohne Port-Encoding (%3A) aufloest, bekommt der IdentityHub-Service
#      zusaetzlich Port 80 -> 10100: ein did:web ohne Port wird bei
#      `edc.iam.did.web.use.https=false` als http://<host>/<path>/did.json aufgeloest.
#      Zugriff von aussen: `kubectl port-forward` (s. u.), nicht ueber traefik.
#
#   3. Vault-Seeding ueber `tx.edc.vault.secrets` (unsere VaultSeedExtension, AP1)
#      statt BIBAs `edc.vault.seed.*`. BDRS-Server entfaellt ersatzlos: die BPN<->DID-
#      Abbildung kommt aus `tx.edc.windx.bdrs.mappings` (windx-bdrs-static, AP2).
#
# Ablauf (die STS-Client-Secrets entstehen erst beim Setup-Job-Lauf):
#
#   kind load docker-image edc-runtime-windx:0.13.0-SNAPSHOT --name mvd
#   kind load docker-image lufbiba/fma-identityhub:0.17 --name mvd
#   kind load docker-image reg.biba.uni-bremen.de/wind-x/luf-bibas-connector:jira132-es256k --name mvd
#   kubectl --context kind-mvd apply -f kubernetes/windx/windx-stack.yaml
#   kubectl --context kind-mvd -n windx wait --for=condition=complete job/windx-setup --timeout=300s
#   kubectl --context kind-mvd -n windx logs job/windx-setup | grep BIBAS_OUTPUT
#   kubectl --context kind-mvd -n windx create secret generic windx-sts-secrets \
#       --from-literal=provider=<PROVIDER_SECRET> --from-literal=consumer=<CONSUMER_SECRET>
#   kubectl --context kind-mvd -n windx rollout restart deploy/windx-provider deploy/windx-consumer
#
# Offen (AP7): signer-private/verifier-public sind noch Dummies -> reicht fuer Katalog +
# Negotiation, NICHT fuer den Datentransfer (dafuer echte EC-Keys seeden).
---
apiVersion: v1
kind: Namespace
metadata:
  name: windx
---
# Geheimnisse stehen bewusst NICHT hier (WP4): ein Wert im committeten YAML ist Klartext in Git.
# Sie werden per `./windx-secrets.sh` erzeugt -- gleiches Muster wie windx-sts-secrets,
# windx-provider-vault-seed und windx-edr-keys. Erwartet werden:
#   windx-superuser-apikey  (apikey)                     -> IdentityHub + Setup-Job
#   windx-ih-secrets        (sts-privatekey, aes-key, api-auth-key, sts-accounts-api-auth-key)
#   windx-connector-api-key (apikey)                     -> Management-API Provider/Consumer
#   windx-db                (password)                   -> PostgreSQL (s. windx-postgres.yaml)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: windx-provider-config
  namespace: windx
data:
  configuration.properties: |
    web.http.port=18180
    web.http.path=/api
    web.http.management.port=18181
    web.http.management.path=/management
    web.http.protocol.port=18182
    web.http.protocol.path=/protocol
    web.http.control.port=18183
    web.http.control.path=/control
    web.http.version.port=18184
    web.http.version.path=/version
    web.http.public.port=19293
    web.http.public.path=/api/public

    # Base-URL der Public-Data-Plane-API, die in die EDR wandert. Ohne dies wird
    # 'http://localhost:19293/api/public' abgeleitet -> vom Consumer nicht erreichbar.
    edc.dataplane.api.public.baseurl=http://windx-provider:19293/api/public

    # edc.api.auth.key kommt als Env EDC_API_AUTH_KEY aus dem Secret windx-connector-api-key (WP4).

    edc.participant.id=did:web:windx-identityhub:provider
    # Pflicht-Setting der persistenten (SQL-)Runtime: ConnectorPostgresqlMigration bricht ohne ab.
    # Stabil halten -- "once set, it must never change" (EDC-Vorgabe).
    edc.participant.context.id=did:web:windx-identityhub:provider
    edc.iam.issuer.id=did:web:windx-identityhub:provider
    tractusx.edc.participant.bpn=BPNL000000000PROV

    edc.dsp.callback.address=http://windx-provider:18182/protocol

    edc.iam.did.web.use.https=false
    edc.iam.sts.oauth.token.url=http://windx-identityhub:8184/api/sts/token
    edc.iam.sts.oauth.client.id=did:web:windx-identityhub:provider
    edc.iam.sts.oauth.client.secret.alias=provider-sts-client-secret

    # ACHTUNG: BIBAs Key `edc.iam.dcp.scopes.*` wird von diesem Stack NICHT gelesen.
    # Tractus-X liest Default-Scopes unter tx.edc.iam.dcp.default-scopes.<alias>.{alias,type,operation}
    # (tx-dcp/DcpDefaultScopeExtension) und baut daraus "<alias>:<type>:<operation>".
    tx.edc.iam.dcp.default-scopes.membership.alias=org.eclipse.dspace.dcp.vc.type
    tx.edc.iam.dcp.default-scopes.membership.type=MembershipCredential
    tx.edc.iam.dcp.default-scopes.membership.operation=read

    edc.iam.trusted-issuer.provider.id=did:web:windx-identityhub:provider

    # AP2 -- ersetzt den BDRS-Server. tx.edc.iam.dcp.bdrs.server.url entfaellt ersatzlos.
    tx.edc.windx.bdrs.mappings=BPNL000000000PROV=did:web:windx-identityhub:provider;BPNL000000000CONS=did:web:windx-identityhub:consumer

    edc.transfer.proxy.token.signer.privatekey.alias=signer-private
    edc.transfer.proxy.token.verifier.publickey.alias=verifier-public

    # Wind-X Mediator: im KinD laeuft kein Semantic Mediator -> Dummy-URL.
    # Pflicht-Setting, sonst bootet die Extension nicht; Mediator-Transfers gehen damit nicht.
    web.http.med.port=18185
    web.http.med.path=/api/med
    tx.edc.windx.mediator.base.url=http://localhost:3051
    edc.dataplane.windx.med.endpoint=http://windx-provider:18185/api/med
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: windx-consumer-config
  namespace: windx
data:
  configuration.properties: |
    web.http.port=28180
    web.http.path=/api
    web.http.management.port=28181
    web.http.management.path=/management
    web.http.protocol.port=28182
    web.http.protocol.path=/protocol
    web.http.control.port=28183
    web.http.control.path=/control
    web.http.version.port=28184
    web.http.version.path=/version
    web.http.public.port=19292
    web.http.public.path=/api/public

    # edc.api.auth.key kommt als Env EDC_API_AUTH_KEY aus dem Secret windx-connector-api-key (WP4).

    edc.participant.id=did:web:windx-identityhub:consumer
    # Pflicht-Setting der persistenten (SQL-)Runtime: ConnectorPostgresqlMigration bricht ohne ab.
    # Stabil halten -- "once set, it must never change" (EDC-Vorgabe).
    edc.participant.context.id=did:web:windx-identityhub:consumer
    edc.iam.issuer.id=did:web:windx-identityhub:consumer
    tractusx.edc.participant.bpn=BPNL000000000CONS

    edc.dsp.callback.address=http://windx-consumer:28182/protocol

    edc.iam.did.web.use.https=false
    edc.iam.sts.oauth.token.url=http://windx-identityhub:8184/api/sts/token
    edc.iam.sts.oauth.client.id=did:web:windx-identityhub:consumer
    edc.iam.sts.oauth.client.secret.alias=consumer-sts-client-secret

    # ACHTUNG: BIBAs Key `edc.iam.dcp.scopes.*` wird von diesem Stack NICHT gelesen.
    # Tractus-X liest Default-Scopes unter tx.edc.iam.dcp.default-scopes.<alias>.{alias,type,operation}
    # (tx-dcp/DcpDefaultScopeExtension) und baut daraus "<alias>:<type>:<operation>".
    tx.edc.iam.dcp.default-scopes.membership.alias=org.eclipse.dspace.dcp.vc.type
    tx.edc.iam.dcp.default-scopes.membership.type=MembershipCredential
    tx.edc.iam.dcp.default-scopes.membership.operation=read

    # Der IdentityHub signiert das MembershipCredential mit dem Provider-Key
    # -> der Provider-DID ist der vertraute Issuer (wie im bibas-Stack).
    edc.iam.trusted-issuer.provider.id=did:web:windx-identityhub:provider

    tx.edc.windx.bdrs.mappings=BPNL000000000PROV=did:web:windx-identityhub:provider;BPNL000000000CONS=did:web:windx-identityhub:consumer

    edc.transfer.proxy.token.signer.privatekey.alias=signer-private
    edc.transfer.proxy.token.verifier.publickey.alias=verifier-public

    web.http.med.port=28185
    web.http.med.path=/api/med
    tx.edc.windx.mediator.base.url=http://localhost:3051
    edc.dataplane.windx.med.endpoint=http://windx-consumer:28185/api/med
---
# Leerer vault.properties-Stub: der IdentityHub bind-mountet die Datei, der Inhalt ist
# irrelevant (Seed-Keys kommen per EDC_SEED_*-Env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: windx-ih-vault
  namespace: windx
data:
  vault.properties: |
    # vault content seeded via EDC_SEED_* env vars
---
# BouncyCastle als JCA-Provider #1, damit der IdentityHub secp256k1/ES256K unterstuetzt
# (SunEC kann es nicht). Uebernommen aus dem bibas-Stack (Jira-132).
apiVersion: v1
kind: ConfigMap
metadata:
  name: windx-jca-security
  namespace: windx
data:
  java.security.extra: |
    security.provider.1=org.bouncycastle.jce.provider.BouncyCastleProvider
    security.provider.2=SUN
    security.provider.3=SunRsaSign
    security.provider.4=SunEC
    security.provider.5=SunJSSE
    security.provider.6=SunJCE
    security.provider.7=SunJGSS
    security.provider.8=SunSASL
    security.provider.9=XMLDSig
    security.provider.10=SunPCSC
    security.provider.11=JdkLDAP
    security.provider.12=JdkSASL
    security.provider.13=SunPKCS11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windx-identityhub
  namespace: windx
  labels:
    app: windx-identityhub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: windx-identityhub
  template:
    metadata:
      labels:
        app: windx-identityhub
    spec:
      containers:
        - name: identityhub
          image: lufbiba/fma-identityhub:0.17
          imagePullPolicy: IfNotPresent
          # DEBUG-Level via Programm-Argument (EDCs ConsoleMonitor filtert vor Log4j2; --log-level ist
          # der einzige Hebel). Hier im YAML, damit `kubectl apply` den IH NICHT rollt -- ein Roll wuerde
          # den In-Memory-Zustand (Participants + STS-Accounts) verlieren und einen erneuten Setup-Lauf erzwingen.
          args: ["--log-level=DEBUG"]
          ports:
            - { name: api,         containerPort: 8181 }
            - { name: identity,    containerPort: 8182 }
            - { name: credentials, containerPort: 8183 }
            - { name: sts,         containerPort: 8184 }
            - { name: did,         containerPort: 10100 }
          env:
            - { name: WEB_HTTP_PORT,             value: "8181" }
            - { name: WEB_HTTP_PATH,             value: /api }
            - { name: WEB_HTTP_IDENTITY_PORT,    value: "8182" }
            - { name: WEB_HTTP_IDENTITY_PATH,    value: /api/identity }
            - { name: WEB_HTTP_CREDENTIALS_PORT, value: "8183" }
            - { name: WEB_HTTP_CREDENTIALS_PATH, value: /api/credentials }
            - { name: WEB_HTTP_STS_PORT,         value: "8184" }
            - { name: WEB_HTTP_STS_PATH,         value: /api/sts }
            - { name: WEB_HTTP_DID_PORT,         value: "10100" }
            - { name: WEB_HTTP_DID_PATH,         value: / }
            - { name: EDC_IAM_DID_WEB_USE_HTTPS, value: "false" }
            - { name: EDC_IAM_STS_PUBLICKEY_ID,  value: my-sts-key }
            - { name: EDC_IAM_STS_PRIVATEKEY_ALIAS, value: sts-private-key }
            # WP4: Werte kommen aus Secrets (windx-secrets.sh), nicht mehr im Klartext hier.
            - name: EDC_STS_ACCOUNTS_API_AUTH_KEY
              valueFrom:
                secretKeyRef: { name: windx-ih-secrets, key: sts-accounts-api-auth-key }
            - name: EDC_API_AUTH_KEY
              valueFrom:
                secretKeyRef: { name: windx-ih-secrets, key: api-auth-key }
            - { name: EDC_ENCRYPTION_AES_KEY_ALIAS, value: sts-aes-key }
            - name: EDC_SEED_AES_KEY_VALUE
              valueFrom:
                secretKeyRef: { name: windx-ih-secrets, key: aes-key }
            # PEM mit echten Zeilenumbruechen -- Env-Werte behalten sie; die SuperUserSeedExtension
            # ersetzt nur literale \n, ist hier also ein No-op.
            - name: EDC_SEED_STS_PRIVATEKEY_VALUE
              valueFrom:
                secretKeyRef: { name: windx-ih-secrets, key: sts-privatekey }
            - name: EDC_IH_SEED_SUPERUSER_APIKEY
              valueFrom:
                secretKeyRef:
                  name: windx-superuser-apikey
                  key: apikey
            - { name: JAVA_TOOL_OPTIONS, value: -Djava.security.properties=/app/jca/java.security.extra }
          volumeMounts:
            - { name: vault, mountPath: /app/vault.properties, subPath: vault.properties }
            - { name: jca-security, mountPath: /app/jca }
          readinessProbe:
            httpGet: { path: /api/check/health, port: 8181 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/check/health, port: 8181 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: vault
          configMap: { name: windx-ih-vault }
        - name: jca-security
          configMap: { name: windx-jca-security }
---
apiVersion: v1
kind: Service
metadata:
  name: windx-identityhub
  namespace: windx
spec:
  selector:
    app: windx-identityhub
  ports:
    # Port 80 -> 10100: laesst did:web:windx-identityhub:<name> ohne Port-Encoding aufloesen.
    - { name: did-http,    port: 80,    targetPort: 10100 }
    - { name: api,         port: 8181,  targetPort: 8181 }
    - { name: identity,    port: 8182,  targetPort: 8182 }
    - { name: credentials, port: 8183,  targetPort: 8183 }
    - { name: sts,         port: 8184,  targetPort: 8184 }
    - { name: did,         port: 10100, targetPort: 10100 }
---
# One-shot: legt Provider- und Consumer-Participant im IdentityHub an, signiert das
# MembershipCredential und emittiert die STS-Client-Secrets als `BIBAS_OUTPUT ...` ins Log.
# Laeuft bewusst auf dem ALTEN Connector-Image: IdentityHubSetup spricht nur die IH-HTTP-API.
apiVersion: batch/v1
kind: Job
metadata:
  name: windx-setup
  namespace: windx
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: windx-setup
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ih
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://windx-identityhub:8181/api/check/health > /dev/null; do
                echo "waiting for IdentityHub..."
                sleep 3
              done
              echo "IdentityHub is healthy."
      containers:
        - name: setup
          image: reg.biba.uni-bremen.de/wind-x/luf-bibas-connector:jira132-es256k
          imagePullPolicy: IfNotPresent
          command: [java, -cp, /app/connector.jar, org.eclipse.edc.sample.setup.IdentityHubSetup]
          env:
            - { name: BIBAS_SETUP_MODE, value: k8s }
            - { name: IH_BASE_URL, value: http://windx-identityhub:8182/api/identity/v1alpha }
            - { name: IH_CREDENTIAL_SERVICE_PREFIX, value: http://windx-identityhub.windx.svc.cluster.local:8183/api/credentials/v1/participants }
            - { name: BIBAS_PROVIDER_DID, value: "did:web:windx-identityhub:provider" }
            - { name: BIBAS_CONSUMER_DID, value: "did:web:windx-identityhub:consumer" }
            - name: IH_SUPERUSER_APIKEY
              valueFrom:
                secretKeyRef:
                  name: windx-superuser-apikey
                  key: apikey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windx-provider
  namespace: windx
  labels:
    app: windx-provider
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: windx-provider
  template:
    metadata:
      labels:
        app: windx-provider
    spec:
      initContainers:
        # Kopiert die statische configuration.properties aus der ConfigMap.
        # Das Vault-Seeding (STS-Secret + echte EC-Keys) kommt NICHT mehr von hier,
        # sondern via Env-Var TX_EDC_VAULT_SECRETS aus dem Secret windx-provider-vault-seed
        # (Env-Werte behalten echte Zeilenumbrueche -> PEM-Keys passen sauber rein).
        - name: assemble-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /config-in/configuration.properties /config-out/configuration.properties
          volumeMounts:
            - { name: config-in,  mountPath: /config-in }
            - { name: config-out, mountPath: /config-out }
      containers:
        - name: connector
          image: edc-runtime-windx-postgresql:0.13.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          args: ["--log-level=DEBUG"]   # DEBUG-Logs des DCP-Flusses (Programm-Argument, kein Setting)
          env:
            # AP1-Vault-Seed als Env-Var (EDCs kanonischer Weg, wie im tractusx-connector-Chart):
            # provider-sts-client-secret + signer-private/verifier-public (echtes EC-Keypair, PEM).
            - name: TX_EDC_VAULT_SECRETS
              valueFrom:
                secretKeyRef:
                  name: windx-provider-vault-seed
                  key: seed
            # WP4: Management-API-Key aus Secret statt Klartext in der ConfigMap.
            - name: EDC_API_AUTH_KEY
              valueFrom:
                secretKeyRef: { name: windx-connector-api-key, key: apikey }
            # Persistenz: die SQL-Stores der persistenten Runtime schreiben in DB `provider`.
            # Env-Var-Form (chart-konform): EDC_DATASOURCE_DEFAULT_* == edc.datasource.default.*
            - { name: EDC_DATASOURCE_DEFAULT_URL,  value: "jdbc:postgresql://windx-postgres:5432/provider" }
            - { name: EDC_DATASOURCE_DEFAULT_USER, value: edc }
            - name: EDC_DATASOURCE_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-db
                  key: password
          ports:
            - { name: api,      containerPort: 18180 }
            - { name: mgmt,     containerPort: 18181 }
            - { name: protocol, containerPort: 18182 }
            - { name: control,  containerPort: 18183 }
            - { name: version,  containerPort: 18184 }
            - { name: med,      containerPort: 18185 }
            - { name: public,   containerPort: 19293 }
          volumeMounts:
            # Der Entrypoint des Images liest -Dedc.fs.config=/app/configuration.properties
            - name: config-out
              mountPath: /app/configuration.properties
              subPath: configuration.properties
          readinessProbe:
            tcpSocket: { port: 18181 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 18181 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config-in
          configMap: { name: windx-provider-config }
        - name: config-out
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: windx-provider
  namespace: windx
spec:
  selector:
    app: windx-provider
  ports:
    - { name: api,      port: 18180, targetPort: 18180 }
    - { name: mgmt,     port: 18181, targetPort: 18181 }
    - { name: protocol, port: 18182, targetPort: 18182 }
    - { name: control,  port: 18183, targetPort: 18183 }
    - { name: version,  port: 18184, targetPort: 18184 }
    - { name: med,      port: 18185, targetPort: 18185 }
    - { name: public,   port: 19293, targetPort: 19293 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windx-consumer
  namespace: windx
  labels:
    app: windx-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: windx-consumer
  template:
    metadata:
      labels:
        app: windx-consumer
    spec:
      initContainers:
        - name: assemble-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              cp /config-in/configuration.properties /config-out/configuration.properties
              printf 'tx.edc.vault.secrets=consumer-sts-client-secret:%s;signer-private:dummy-signer;verifier-public:dummy-verifier\n' \
                "${CONSUMER_STS_CLIENT_SECRET}" >> /config-out/configuration.properties
              echo "==== effective configuration.properties (consumer) ===="
              cat /config-out/configuration.properties
          env:
            - name: CONSUMER_STS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: windx-sts-secrets
                  key: consumer
          volumeMounts:
            - { name: config-in,  mountPath: /config-in }
            - { name: config-out, mountPath: /config-out }
      containers:
        - name: connector
          image: edc-runtime-windx-postgresql:0.13.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          args: ["--log-level=DEBUG"]   # DEBUG-Logs des DCP-Flusses (Programm-Argument, kein Setting)
          env:
            # WP4: Management-API-Key aus Secret statt Klartext in der ConfigMap.
            - name: EDC_API_AUTH_KEY
              valueFrom:
                secretKeyRef: { name: windx-connector-api-key, key: apikey }
            # Persistenz: die SQL-Stores der persistenten Runtime schreiben in DB `consumer`.
            - { name: EDC_DATASOURCE_DEFAULT_URL,  value: "jdbc:postgresql://windx-postgres:5432/consumer" }
            - { name: EDC_DATASOURCE_DEFAULT_USER, value: edc }
            - name: EDC_DATASOURCE_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-db
                  key: password
          ports:
            - { name: api,      containerPort: 28180 }
            - { name: mgmt,     containerPort: 28181 }
            - { name: protocol, containerPort: 28182 }
            - { name: control,  containerPort: 28183 }
            - { name: version,  containerPort: 28184 }
            - { name: med,      containerPort: 28185 }
            - { name: public,   containerPort: 19292 }
          volumeMounts:
            - name: config-out
              mountPath: /app/configuration.properties
              subPath: configuration.properties
          readinessProbe:
            tcpSocket: { port: 28181 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 28181 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config-in
          configMap: { name: windx-consumer-config }
        - name: config-out
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: windx-consumer
  namespace: windx
spec:
  selector:
    app: windx-consumer
  ports:
    - { name: api,      port: 28180, targetPort: 28180 }
    - { name: mgmt,     port: 28181, targetPort: 28181 }
    - { name: protocol, port: 28182, targetPort: 28182 }
    - { name: control,  port: 28183, targetPort: 28183 }
    - { name: version,  port: 28184, targetPort: 28184 }
    - { name: med,      port: 28185, targetPort: 28185 }
    - { name: public,   port: 19292, targetPort: 19292 }
